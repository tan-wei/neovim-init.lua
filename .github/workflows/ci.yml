name: CI

on:
  push:
  pull_request:
  schedule:
    # Daily at 00:47 UTC
    - cron: '47 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

jobs:
  stylua:
    name: Stylua
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout config
        uses: actions/checkout@v7

      - name: Install just
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y just

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install stylua
        shell: bash
        run: |
          set -euxo pipefail

          cargo install stylua --locked

      - name: Run stylua check
        run: just stylua-check

  link-check:
    name: Plugin link check
    runs-on: ubuntu-24.04

    env:
      NVIM_APPNAME: nvim

    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          path: xdg/nvim

      - name: 🔧 Setup environment
        shell: bash
        run: |
          echo "::group::Export XDG paths"
          set -x
          export XDG_CONFIG_HOME="$GITHUB_WORKSPACE/xdg"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          export XDG_STATE_HOME="$RUNNER_TEMP/xdg-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$XDG_STATE_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          set +x
          echo "::endgroup::"

          echo "::group::Install system dependencies"
          set -x
          sudo apt-get update
          sudo apt-get install -y curl just tar
          set +x
          echo "::endgroup::"

          echo "::group::Prepare XDG directories"
          set -x
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          set +x
          echo "::endgroup::"

          echo "::group::Install Neovim nightly"
          set -x
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

      - name: 📦 Bootstrap plugins
        shell: bash
        run: |
          cd "${{ github.workspace }}/xdg/nvim"
          echo "::group::Sync plugins (lazy.nvim)"
          set -x
          just bootstrap-lazy
          set +x
          echo "::endgroup::"

      - name: 🔗 Run link check
        working-directory: ${{ github.workspace }}/xdg/nvim
        env:
          LINK_CHECK_JOBS: 12
        run: just link-check

  colorscheme-check:
    name: Colorscheme check
    runs-on: ubuntu-24.04

    env:
      NVIM_APPNAME: nvim

    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          path: xdg/nvim

      - name: 🔧 Setup environment
        shell: bash
        run: |
          echo "::group::Export XDG paths"
          set -x
          export XDG_CONFIG_HOME="$GITHUB_WORKSPACE/xdg"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          export XDG_STATE_HOME="$RUNNER_TEMP/xdg-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$XDG_STATE_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          set +x
          echo "::endgroup::"

          echo "::group::Install system dependencies"
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl fd-find gzip just ripgrep tar unzip
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          set +x
          echo "::endgroup::"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🔧 Install tools & Neovim
        shell: bash
        run: |
          echo "::group::Install tree-sitter-cli"
          set -x
          archive="$RUNNER_TEMP/tree-sitter-linux-x64.gz"
          install_dir="$RUNNER_TEMP/tree-sitter"
          curl -fsSLo "$archive" \
            "https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz"
          mkdir -p "$install_dir"
          gunzip -c "$archive" > "$install_dir/tree-sitter"
          chmod +x "$install_dir/tree-sitter"
          echo "$install_dir" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

          echo "::group::Prepare XDG directories"
          set -x
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          set +x
          echo "::endgroup::"

          echo "::group::Install Neovim nightly"
          set -x
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

      - name: 📦 Bootstrap plugins
        shell: bash
        run: |
          cd "${{ github.workspace }}/xdg/nvim"
          echo "::group::Sync plugins (lazy.nvim)"
          set -x
          just bootstrap-lazy
          set +x
          echo "::endgroup::"

          echo "::group::Install tree-sitter parsers"
          set -x
          just bootstrap-treesitter
          set +x
          echo "::endgroup::"

          echo "::group::Install Mason packages"
          set -x
          just bootstrap-mason
          set +x
          echo "::endgroup::"

      - name: 🎨 Run colorscheme check
        working-directory: ${{ github.workspace }}/xdg/nvim
        run: just colorscheme-check

  health-check:
    name: Checkhealth
    runs-on: ubuntu-24.04

    env:
      NVIM_APPNAME: nvim

    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          path: xdg/nvim

      - name: 🔧 Setup environment
        shell: bash
        run: |
          echo "::group::Export XDG paths"
          set -x
          export XDG_CONFIG_HOME="$GITHUB_WORKSPACE/xdg"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          export XDG_STATE_HOME="$RUNNER_TEMP/xdg-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg-cache"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$XDG_STATE_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          set +x
          echo "::endgroup::"

          echo "::group::Install system dependencies"
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl fd-find gzip just ripgrep tar unzip imagemagick pandoc zathura xdotool luarocks luajit xclip
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          set +x
          echo "::endgroup::"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🔧 Install tools & Neovim
        shell: bash
        run: |
          echo "::group::Install tree-sitter-cli"
          set -x
          archive="$RUNNER_TEMP/tree-sitter-linux-x64.gz"
          install_dir="$RUNNER_TEMP/tree-sitter"
          curl -fsSLo "$archive" \
            "https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz"
          mkdir -p "$install_dir"
          gunzip -c "$archive" > "$install_dir/tree-sitter"
          chmod +x "$install_dir/tree-sitter"
          echo "$install_dir" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

          echo "::group::Install lazygit"
          set -x
          LAZYGIT_VERSION=$(curl -sI "https://github.com/jesseduffield/lazygit/releases/latest" | grep -i "location:" | tail -1 | sed 's/.*\/v//' | tr -d '\r')
          curl -fsSLo "$RUNNER_TEMP/lazygit.tar.gz" \
            "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/lazygit.tar.gz" -C "$RUNNER_TEMP" lazygit
          sudo mv "$RUNNER_TEMP/lazygit" /usr/local/bin/lazygit
          set +x
          echo "::endgroup::"

          echo "::group::Prepare XDG directories"
          set -x
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          set +x
          echo "::endgroup::"

          echo "::group::Install Neovim nightly"
          set -x
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

      - name: 📦 Bootstrap plugins
        shell: bash
        run: |
          cd "${{ github.workspace }}/xdg/nvim"
          echo "::group::Sync plugins (lazy.nvim)"
          set -x
          just bootstrap-lazy
          set +x
          echo "::endgroup::"

          echo "::group::Install tree-sitter parsers"
          set -x
          just bootstrap-treesitter
          set +x
          echo "::endgroup::"

          echo "::group::Install Mason packages"
          set -x
          just bootstrap-mason
          set +x
          echo "::endgroup::"

      - name: 🏥 Run health check
        working-directory: ${{ github.workspace }}/xdg/nvim
        run: just health-check

  bootstrap-smoke:
    name: ${{ matrix.os_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Linux
            arch: x86_64
            runner: ubuntu-24.04
            nvim_archive: nvim-linux-x86_64.tar.gz
            nvim_dir: nvim-linux-x86_64
            tree_sitter_unix_archive: tree-sitter-linux-x64.gz
          - os_name: macOS
            arch: arm64
            runner: macos-15
            nvim_archive: nvim-macos-arm64.tar.gz
            nvim_dir: nvim-macos-arm64
            tree_sitter_unix_archive: tree-sitter-macos-arm64.gz
          - os_name: Windows
            arch: x86_64
            runner: windows-2025
            nvim_archive: nvim-win64.zip
            nvim_dir: nvim-win64
            tree_sitter_windows_archive: tree-sitter-cli-windows-x64.zip
          - os_name: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            nvim_archive: nvim-linux-arm64.tar.gz
            nvim_dir: nvim-linux-arm64
            tree_sitter_unix_archive: tree-sitter-linux-arm64.gz
          - os_name: macOS
            arch: x86_64
            runner: macos-15-intel
            nvim_archive: nvim-macos-x86_64.tar.gz
            nvim_dir: nvim-macos-x86_64
            tree_sitter_unix_archive: tree-sitter-macos-x64.gz
          - os_name: Windows
            arch: arm64
            runner: windows-11-arm
            nvim_archive: nvim-win-arm64.zip
            nvim_dir: nvim-win-arm64
            tree_sitter_windows_archive: tree-sitter-cli-windows-arm64.zip

    env:
      NVIM_APPNAME: nvim

    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          path: xdg/nvim

      - name: 🔧 Setup environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "::group::Export XDG paths"
          set -x
          echo "XDG_CONFIG_HOME=$GITHUB_WORKSPACE/xdg" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg-data" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/xdg-state" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache" >> "$GITHUB_ENV"
          set +x
          echo "::endgroup::"

      - name: 🔧 Setup environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "::group::Export XDG paths"
          $configHome = Join-Path $env:GITHUB_WORKSPACE 'xdg'
          $dataHome = Join-Path $env:RUNNER_TEMP 'xdg-data'
          $stateHome = Join-Path $env:RUNNER_TEMP 'xdg-state'
          $cacheHome = Join-Path $env:RUNNER_TEMP 'xdg-cache'
          Add-Content -Path $env:GITHUB_ENV -Value "XDG_CONFIG_HOME=$configHome"
          Add-Content -Path $env:GITHUB_ENV -Value "XDG_DATA_HOME=$dataHome"
          Add-Content -Path $env:GITHUB_ENV -Value "XDG_STATE_HOME=$stateHome"
          Add-Content -Path $env:GITHUB_ENV -Value "XDG_CACHE_HOME=$cacheHome"
          Write-Output "::endgroup::"

      - name: 🔧 Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::Install system dependencies"
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl fd-find gzip just ripgrep tar unzip
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          set +x
          echo "::endgroup::"

      - name: 🔧 Install system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "::group::Install system dependencies"
          set -x
          brew untap aws/tap || true
          brew trust --formula azure/bicep/bicep || true
          brew trust --formula hashicorp/tap/packer || true
          brew install cmake fd gnu-tar just ripgrep
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

      - name: 🔧 Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "::group::Install system dependencies"
          choco install -y cmake fd just ripgrep
          Write-Output "::endgroup::"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Set up Rust toolchain on Unix
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: 🔧 Prepare directories & tools (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "::group::Prepare XDG directories"
          set -x
          export XDG_DATA_HOME="$XDG_DATA_HOME"
          export XDG_STATE_HOME="$XDG_STATE_HOME"
          export XDG_CACHE_HOME="$XDG_CACHE_HOME"
          mkdir -p "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          set +x
          echo "::endgroup::"

          echo "::group::Install tree-sitter-cli"
          set -x
          archive="$RUNNER_TEMP/${{ matrix.tree_sitter_unix_archive }}"
          install_dir="$RUNNER_TEMP/tree-sitter"
          curl -fsSLo "$archive" \
            "https://github.com/tree-sitter/tree-sitter/releases/latest/download/${{ matrix.tree_sitter_unix_archive }}"
          mkdir -p "$install_dir"
          gunzip -c "$archive" > "$install_dir/tree-sitter"
          chmod +x "$install_dir/tree-sitter"
          echo "$install_dir" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

          echo "::group::Install Neovim nightly"
          set -x
          curl -fsSLo "$RUNNER_TEMP/${{ matrix.nvim_archive }}" \
            "https://github.com/neovim/neovim/releases/download/nightly/${{ matrix.nvim_archive }}"
          tar -xzf "$RUNNER_TEMP/${{ matrix.nvim_archive }}" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${{ matrix.nvim_dir }}/bin" >> "$GITHUB_PATH"
          set +x
          echo "::endgroup::"

      - name: 🔧 Prepare directories & tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "::group::Prepare XDG directories"
          New-Item -ItemType Directory -Force -Path $env:XDG_DATA_HOME | Out-Null
          New-Item -ItemType Directory -Force -Path $env:XDG_STATE_HOME | Out-Null
          New-Item -ItemType Directory -Force -Path $env:XDG_CACHE_HOME | Out-Null
          Write-Output "::endgroup::"

          Write-Output "::group::Install tree-sitter-cli"
          $archive = '${{ matrix.tree_sitter_windows_archive }}'
          $downloadUrl = "https://github.com/tree-sitter/tree-sitter/releases/latest/download/$archive"
          $destination = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP 'tree-sitter'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $destination
          Expand-Archive -Path $destination -DestinationPath $installDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          Write-Output "::endgroup::"

          Write-Output "::group::Install Neovim nightly"
          $archive = '${{ matrix.nvim_archive }}'
          $downloadUrl = "https://github.com/neovim/neovim/releases/download/nightly/$archive"
          $destination = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP 'nvim'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $destination
          Expand-Archive -Path $destination -DestinationPath $installDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $installDir '${{ matrix.nvim_dir }}\bin')
          Write-Output "::endgroup::"

      - name: 🔧 Show tool versions (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "::group::Tool versions"
          set -x
          nvim --version | head -n 5
          tree-sitter --version
          python --version
          node --version
          npm --version
          ruby --version
          go version
          cargo --version
          rustc --version
          just --version
          set +x
          echo "::endgroup::"

      - name: 🔧 Show tool versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "::group::Tool versions"
          nvim --version | Select-Object -First 5
          tree-sitter --version
          python --version
          node --version
          npm --version
          ruby --version
          go version
          just --version
          Write-Output "::endgroup::"

      - name: 📋 Run keymap docs check
        working-directory: ${{ github.workspace }}/xdg/nvim
        run: just keymap-docs-check

      - name: 📦 Bootstrap plugins
        shell: bash
        run: |
          cd "${{ github.workspace }}/xdg/nvim"
          echo "::group::Sync plugins (lazy.nvim)"
          set -x
          just bootstrap-lazy
          set +x
          echo "::endgroup::"

          echo "::group::Install tree-sitter parsers"
          set -x
          just bootstrap-treesitter
          set +x
          echo "::endgroup::"

          echo "::group::Install Mason packages"
          set -x
          just bootstrap-mason
          set +x
          echo "::endgroup::"

      - name: 📋 Run keymap audit
        working-directory: ${{ github.workspace }}/xdg/nvim
        run: just keymap-audit-check

      - name: 🧪 Run smoke test
        working-directory: ${{ github.workspace }}/xdg/nvim
        run: just bootstrap-smoke
